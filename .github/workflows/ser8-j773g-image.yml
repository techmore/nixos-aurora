name: SER8 J773g binary-kernel image
run-name: SER8 J773g binary-kernel image (${{ github.sha }})

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  actions: read

concurrency:
  group: ser8-j773g-image
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  image:
    if: github.repository == 'techmore/nixos-aurora' && github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, ser8, nix]
    timeout-minutes: 180
    env:
      NP_GIT: /usr/bin/git
      NP_LOCATION: /home/sdolbec
      TMPDIR: /home/sdolbec/.local/share/actions-runner-nixos-aurora/_work/_temp
      NIX_CONFIG: |
        extra-substituters = http://10.20.0.117:5000
        extra-trusted-public-keys = ser8-aurora-1:CYaqyjTrDutEdGVEBbqTr2FdwvjWFq+4xW1k2CIo82s=
        connect-timeout = 30
        stalled-download-timeout = 300
        download-attempts = 12
        max-substitution-jobs = 1
        http-connections = 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify trusted SER8 execution and capacity
        run: |
          test "$GITHUB_REPOSITORY" = techmore/nixos-aurora
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$RUNNER_ARCH" = X64
          used=$(df -P / | awk 'NR == 2 { sub(/%/, "", $5); print $5 }')
          test "$used" -lt 85
          nix --version
          curl --fail --silent --show-error http://10.20.0.117:5000/nix-cache-info

      - name: Import verified Aurora-specific closures once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          receipt=/home/sdolbec/.local/state/ser8-nix-cache/aurora-import-b3218010.json
          if test -s "$receipt"; then
            cp "$receipt" build-import.json
          else
            nice -n 10 ionice -c 2 -n 7 python3 scripts/import-build-cache.py \
              --output build-import.json \
              --packages fex-mesa flatpak-gl mesa audio ucm aura avd-fw alsa-utils
            install -m 0644 build-import.json "$receipt"
          fi

      - name: Materialize the exact run-59 binary kernel
        run: |
          nice -n 10 ionice -c 2 -n 7 nix build \
            --max-jobs 1 --cores 2 --print-build-logs \
            --out-link binary-kernel .#packages.x86_64-linux.j773g-binary-kernel
          kernel_store=$(readlink binary-kernel)
          kernel_host=/home/sdolbec/.nix-portable/nix${kernel_store#/nix}
          test "$(sha256sum "$kernel_host/Image" | cut -d' ' -f1)" = \
            13d3d96630b2cb68c5d3828819431fe5b4c851a4f40c0b498978ead27fe662e7
          test "$(sha256sum "$kernel_host/dtbs/apple/t8132-j773g.dtb" | cut -d' ' -f1)" = \
            5a72db650a379a3320d2736be69a152c5836e16a3cb038a50f0d692180620e46

      - name: Build the KDE system and installer closures
        run: |
          nice -n 10 ionice -c 2 -n 7 nix build \
            --max-jobs 1 --cores 14 --print-build-logs \
            --out-link system .#nixosConfigurations.aurora-kde.config.system.build.toplevel
          nice -n 10 ionice -c 2 -n 7 nix build \
            --max-jobs 1 --cores 14 --print-build-logs \
            --out-link installer .#nixosConfigurations.aurora-kde.config.system.build.nixos-install

      - name: Prove the outputs are served by SER8
        run: |
          for path in "$(readlink binary-kernel)" "$(readlink system)" "$(readlink installer)"; do
            hash=${path#/nix/store/}
            hash=${hash%%-*}
            curl --fail --silent --show-error "http://10.20.0.117:5000/$hash.narinfo" \
              | grep -q '^Sig: ser8-aurora-1:'
          done
          used=$(df -P / | awk 'NR == 2 { sub(/%/, "", $5); print $5 }')
          test "$used" -lt 85

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: ser8-j773g-build-receipt
          path: build-import.json
          retention-days: 14
